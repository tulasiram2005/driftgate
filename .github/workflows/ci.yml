name: Quality Gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"
  HUSKY: "0"

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      store-db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: threadline
          POSTGRES_PASSWORD: ci-demo-only
          POSTGRES_DB: threadline
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U threadline -d threadline" --health-interval 5s --health-timeout 5s --health-retries 10
      test-db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: threadline
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: threadline_test
        ports: ["5433:5432"]
        options: --health-cmd "pg_isready -U threadline -d threadline_test" --health-interval 5s --health-timeout 5s --health-retries 10
      api-test-db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: driftgate
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: driftgate_test
        ports: ["5434:5432"]
        options: --health-cmd "pg_isready -U driftgate -d driftgate_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://threadline:ci-demo-only@localhost:5432/threadline
      TEST_DATABASE_URL: postgresql://threadline:ci-test-only@localhost:5433/threadline_test
      TEST_API_DATABASE_URL: postgresql://driftgate:ci-test-only@localhost:5434/driftgate_test
      RUNNER_CALLBACK_SECRET: ci-test-only-runner-callback-secret-123456789
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Prepare storefront databases
        run: |
          pnpm --filter @driftgate/demo-store db:migrate
          DATABASE_URL="$TEST_DATABASE_URL" pnpm --filter @driftgate/demo-store db:migrate
          pnpm --filter @driftgate/demo-store db:seed
      - name: Lint and formatting
        run: pnpm lint
      - name: Prepare API test database
        run: DATABASE_URL="$TEST_API_DATABASE_URL" pnpm --filter @driftgate/api db:migrate
      - name: Unit tests and coverage
        run: pnpm test
      - name: Restricted SQL assertion integration
        run: pnpm --filter @driftgate/api exec tsx integration/sql-checks.ts
      - name: Production build
        run: pnpm build
      - name: Install browser engines
        run: pnpm --filter ./apps/web exec playwright install --with-deps chromium firefox webkit
      - name: Browser and accessibility checks
        run: |
          DATABASE_URL="$TEST_API_DATABASE_URL" JWT_SECRET="ci-only-testing-secret-with-no-production-access-123456789" API_CORS_ORIGINS="http://localhost:3100,http://127.0.0.1:3100" pnpm --filter @driftgate/api start > /tmp/driftgate-api.log 2>&1 &
          trap 'kill $(jobs -p) 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do curl --fail --silent http://127.0.0.1:4100/ready && break; sleep 1; done
          curl --fail --silent http://127.0.0.1:4100/ready || { cat /tmp/driftgate-api.log; exit 1; }
          pnpm test:e2e
      - name: Runner quality detection fixtures
        run: pnpm --filter @driftgate/runner exec tsx integration/quality.ts
      - name: Dependency audit
        run: pnpm audit --audit-level=high
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-evidence
          path: |
            coverage/
            apps/web/coverage/
            apps/web/playwright-report/
            apps/web/test-results/
            apps/demo-store/coverage/
            apps/demo-store/playwright-report/
            apps/demo-store/test-results/
          if-no-files-found: warn
          retention-days: 14
