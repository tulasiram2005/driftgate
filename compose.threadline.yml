services:
  threadline-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: threadline
      POSTGRES_PASSWORD: local-demo-only
      POSTGRES_DB: threadline
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - threadline-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threadline -d threadline"]
      interval: 5s
      timeout: 5s
      retries: 10
  threadline-test-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: threadline
      POSTGRES_PASSWORD: local-test-only
      POSTGRES_DB: threadline_test
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threadline -d threadline_test"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  threadline-data:
